name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Versi rilis, misalnya v1.7.4'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release version
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected_version="${RELEASE_VERSION#v}"
          actual_version="$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('version.json', 'utf8')).version)")"
          [[ "$actual_version" == "$expected_version" ]]
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git fetch --tags --force
            ! git rev-parse -q --verify "refs/tags/$RELEASE_VERSION"
          fi

      - name: Install dependencies
        run: npm ci
      - name: Sync Android project
        run: npm run android:sync

      - name: Restore release signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/notaku-release.jks
          printf 'storeFile=../notaku-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Build debug APK
        if: env.IS_RELEASE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build signed release APK
        if: env.IS_RELEASE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Prepare APK artifact
        shell: bash
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk NotaKu-${RELEASE_VERSION}.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk NotaKu-debug.apk
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NotaKu-Android
          path: NotaKu-*.apk

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_VERSION" -m "NotaKu $RELEASE_VERSION"
            git push origin "$RELEASE_VERSION"
          fi
          gh release create "$RELEASE_VERSION" "NotaKu-${RELEASE_VERSION}.apk" --title "NotaKu $RELEASE_VERSION" --generate-notes
