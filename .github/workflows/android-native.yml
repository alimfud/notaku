name: NotaKu Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Bundle NotaKu web app into Android APK
        run: npm run android:sync
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Collect APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk "NotaKu-${GITHUB_REF_NAME}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk NotaKu-debug.apk
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: NotaKu-Android, path: NotaKu-*.apk }
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" "NotaKu-${GITHUB_REF_NAME}.apk" --title "NotaKu $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "NotaKu-${GITHUB_REF_NAME}.apk" --clobber
