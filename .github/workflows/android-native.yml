name: NotaKu Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish a release APK
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Bundle NotaKu web app into Android APK
        run: npm run android:sync
      - name: Restore release signing key
        if: env.RELEASE_BUILD == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/notaku-release.jks
          printf 'storeFile=../notaku-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
      - name: Build debug APK
        if: env.RELEASE_BUILD != 'true'
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build release APK
        if: env.RELEASE_BUILD == 'true'
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Collect APK
        id: apk
        run: |
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            release_tag="$GITHUB_REF_NAME"
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              release_tag="v$(node -p "JSON.parse(require('fs').readFileSync('version.json', 'utf8')).version")"
            fi
            cp android/app/build/outputs/apk/release/app-release.apk "NotaKu-$release_tag.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk NotaKu-debug.apk
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NotaKu-Android
          path: NotaKu-*.apk
      - name: Publish GitHub Release
        if: env.RELEASE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('version.json', 'utf8')).version")"
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            release_tag="v$version"
          fi
          gh release create "$release_tag" "NotaKu-$release_tag.apk" --target "$GITHUB_SHA" --title "NotaKu $release_tag" --generate-notes             || gh release upload "$release_tag" "NotaKu-$release_tag.apk" --clobber
