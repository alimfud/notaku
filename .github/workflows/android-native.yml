name: NotaKu Native Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2
        with: { gradle-version: '8.11.1' }
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android-native
        run: gradle assembleDebug
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android-native
        run: gradle assembleRelease
      - name: Collect APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp android-native/app/build/outputs/apk/release/app-release*.apk "NotaKu-${GITHUB_REF_NAME}.apk"
          else
            cp android-native/app/build/outputs/apk/debug/app-debug.apk NotaKu-debug.apk
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: NotaKu-Android, path: NotaKu-*.apk }
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" "NotaKu-${GITHUB_REF_NAME}.apk" --title "NotaKu $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "NotaKu-${GITHUB_REF_NAME}.apk" --clobber
