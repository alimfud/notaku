<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf0e0">
<title>NotaKu</title>
<meta name="description" content="Aplikasi kasir & nota penjualan sederhana.">
<style>html:not(.theme-ready) body{visibility:hidden}</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NotaKu">

<link rel="stylesheet" href="css/receipt.css">
<link rel="stylesheet" href="css/pages/home.css">
<link rel="stylesheet" href="css/pages/products.css">
<link rel="stylesheet" href="css/pages/customers.css">
<link rel="stylesheet" href="css/pages/expenses.css">
<link rel="stylesheet" href="css/pages/reports.css">
<link rel="stylesheet" href="css/pages/settings.css">
<link rel="stylesheet" href="css/pages/sale-new.css">
<link rel="stylesheet" href="css/pages/sale-edit.css">
<link rel="stylesheet" href="css/pages/sale-form.css">
<link rel="stylesheet" href="css/pages/sale-detail.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/pages/dashboard.css">
<link rel="stylesheet" href="css/charts.css">
<link id="themeNeo" rel="stylesheet" href="css/neo.css" media="not all">
<link id="themeClay" rel="stylesheet" href="css/clay.css" media="not all">
<link rel="stylesheet" href="css/bottomnav.css">
<link rel="stylesheet" href="css/motion.css">
<script>
/* Tema tersimpan dan stylesheet-nya harus siap sebelum UI terlihat. */
(function(){
  var t='clay';
  try{var v=localStorage.getItem('notaku-theme');if(v==='dark')t=v;}catch(e){}
  var root=document.documentElement;
  root.setAttribute('data-theme',t);
  var n=document.getElementById('themeNeo');if(n)n.media=(t==='dark')?'all':'not all';
  var y=document.getElementById('themeClay');if(y)y.media=(t==='clay')?'all':'not all';
  var c={dark:'#1b2354',clay:'#fbf0e0'};
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',c[t]);

  var themeLink={dark:n,clay:y}[t];
  var reveal=function(){root.classList.add('theme-ready');};
  if(!themeLink){reveal();return;}
  themeLink.addEventListener('load',reveal,{once:true});
  themeLink.addEventListener('error',reveal,{once:true});
  try{if(themeLink.sheet&&themeLink.sheet.cssRules.length>0)reveal();}catch(e){}
})();
</script>
</head>
<body>

<div id="app">
  <header id="topbar">
    <button id="btnMenu" class="icon-btn" aria-label="Menu">

    </button>
    <button id="btnBack" class="icon-btn hidden" aria-label="Kembali">

    </button>
    <h1 id="pageTitle">NotaKu</h1>
    <button id="btnGlobalSearch" class="icon-btn" aria-label="Pencarian global" title="Cari"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
    <button id="btnThemeToggle" class="icon-btn theme-toggle" aria-label="Ganti ke tema Neo" title="Ganti ke tema Neo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>

    </button>
    <button class="nav-btn nav-btn--desktop-only" data-route="settings/backup">

    </button>
    <button class="nav-btn nav-btn--mobile-only" data-route="settings">

    </button>
  </nav>
</div>

<div id="drawerOverlay" class="drawer-overlay hidden"></div>
