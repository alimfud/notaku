<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#791e38">
<title>NotaKu</title>
<meta name="description" content="Aplikasi kasir & nota penjualan sederhana.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NotaKu">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/receipt.css">
<link rel="stylesheet" href="css/pages/home.css">
<link rel="stylesheet" href="css/pages/products.css">
<link rel="stylesheet" href="css/pages/customers.css">
<link rel="stylesheet" href="css/pages/expenses.css">
<link rel="stylesheet" href="css/pages/reports.css">
<link rel="stylesheet" href="css/pages/settings.css">
<link rel="stylesheet" href="css/pages/sale-new.css">
<link rel="stylesheet" href="css/pages/sale-edit.css">
<link rel="stylesheet" href="css/pages/sale-form.css">
<link rel="stylesheet" href="css/pages/sale-detail.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/pages/dashboard.css">
<link rel="stylesheet" href="css/charts.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <button id="btnMenu" class="icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="btnBack" class="icon-btn hidden" aria-label="Kembali">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="pageTitle">NotaKu</h1>
    <div id="topbarActions"></div>
  </header>

  <main id="pageRoot"></main>

  <nav id="bottomnav">
    <button class="nav-btn" data-route="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      <span>Beranda</span>
    </button>
    <button class="nav-btn" data-route="home">
      <svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3.5-2.2L12 21l-3.5-2.2L5 21V3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Nota</span>
    </button>
    <button class="nav-btn" data-route="sale/new">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7 12h10M12 7v10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Buat Nota</span>
    </button>
    <button class="nav-btn" data-route="products">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor"/></svg>
      <span>Produk</span>
    </button>
    <div class="nav-section-label--desktop" aria-hidden="true">Lainnya</div>
    <button class="nav-btn nav-btn--desktop-only" data-route="customers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/></svg>
      <span>Pelanggan</span>
    </button>
    <button class="nav-btn nav-btn--desktop-only" data-route="expenses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 8h18M16 13h5M16 16h1"/></svg>
      <span>Pengeluaran</span>
    </button>
    <button class="nav-btn nav-btn--desktop-only" data-route="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span>Laporan</span>
    </button>
    <div class="nav-divider--desktop" aria-hidden="true"></div>
    <button class="nav-btn nav-btn--desktop-only" data-route="settings/store">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2-6H5l-2 6zM5 10v10h14V10M9 20v-6h6v6"/></svg>
      <span>Info Toko</span>
    </button>
    <button class="nav-btn nav-btn--desktop-only" data-route="settings/invoice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3zM8 8h8M8 12h8M8 16h4"/></svg>
      <span>Nomor Nota</span>
    </button>
    <button class="nav-btn nav-btn--desktop-only" data-route="settings/printer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg>
      <span>Printer</span>
    </button>
    <button class="nav-btn nav-btn--desktop-only" data-route="settings/qris">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v2M14 20h2M19 19h2v2h-2"/></svg>
      <span>QRIS</span>
    </button>
    <button class="nav-btn nav-btn--desktop-only" data-route="settings/backup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.5A4.5 4.5 0 0 0 18 8h-1.1A6 6 0 0 0 5 9.5 3.5 3.5 0 0 0 5.5 16H8"/><path d="M12 12v9m-3-3 3 3 3-3"/></svg>
      <span>Backup / Restore</span>
    </button>
    <button class="nav-btn nav-btn--mobile-only" data-route="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.5-2.4.6a7.6 7.6 0 00-1.7-1L15 3h-6l-.3 2.6a7.6 7.6 0 00-1.7 1l-2.4-.6-2 3.5L4.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.5 2.4-.6a7.6 7.6 0 001.7 1L9 21h6l.3-2.6a7.6 7.6 0 001.7-1l2.4.6 2-3.5L19.4 13z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span>Lainnya</span>
    </button>
  </nav>
</div>

<div id="drawerOverlay" class="drawer-overlay hidden"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-title">NotaKu</div>
  <button class="drawer-item" data-route="dashboard">Beranda</button>
  <button class="drawer-item" data-route="home">Nota</button>
  <button class="drawer-item" data-route="products">Produk</button>
  <button class="drawer-item" data-route="customers">Pelanggan</button>
  <button class="drawer-item" data-route="expenses">Pengeluaran</button>
  <button class="drawer-item" data-route="reports">Laporan</button>
  <div class="drawer-sep"></div>
  <button class="drawer-item" data-route="settings">Setting</button>
</aside>

<div id="sheetRoot"></div>
<div id="toast"></div>
<div id="loadingOverlay" class="hidden" role="status" aria-live="polite" aria-label="Sedang memproses">
  <div class="loading-mark" aria-hidden="true">
    <img src="icons/icon-192.png" alt="">
    <span>NotaKu</span>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
